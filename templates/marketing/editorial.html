<section class="section wrap reveal"><div class="section-head"><p class="eyebrow">{{ p.nav | upper }}</p><h2>{{ p.section }}</h2><p>{{ p.summary }}</p></div><div class="editorial-grid">{% for title, text in p.cards %}<article><span class="line-icon" aria-hidden="true">{{ ['◫','◎','✳'][loop.index0] }}</span><h3>{{ title }}</h3><p>{{ text }}</p></article>{% endfor %}</div></section>
