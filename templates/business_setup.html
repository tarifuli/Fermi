{% extends "base.html" %}
{% block content %}
<section style="max-width:580px;margin:3rem auto;padding:2rem">
<h1>Set up your business</h1>
<p>You can explore Fermi first. Add your business when you are ready.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
<label for="business_name">Business name</label>
<input id="business_name" name="business_name" maxlength="120" required autocomplete="organization" style="display:block;width:100%;padding:12px;margin:12px 0">
<button type="submit">Create business profile</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Explore dashboard instead</a></p>
</section>
{% endblock %}
